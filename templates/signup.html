<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="auth-wrap">
    <form class="auth-card" method="post" action="{{ url_for('signup') }}">
      <h1 class="auth-title"><span class="play">▶</span> 회원가입</h1>
      {% with messages = get_flashed_messages() %}
        {% if messages %}<p class="auth-error">{{ messages[0] }}</p>{% endif %}
      {% endwith %}
      <input name="username" type="text" placeholder="아이디"
             value="{{ username or '' }}" autofocus required />
      <input name="password" type="password" placeholder="비밀번호 (4자 이상)" required />
      <button type="submit">가입하기</button>
      <p class="auth-alt">이미 계정이 있나요? <a href="{{ url_for('login') }}">로그인</a></p>
    </form>
  </div>
</body>
</html>
